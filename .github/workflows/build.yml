name: Build Debug APK

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # LiteRT-LM 0.17.1 publishes its Android API as Java 21 bytecode.
          # The app modules still emit Java 11-compatible bytecode.
          java-version: "21"
          distribution: "zulu"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Debug APK to Pgyer
        if: github.event_name == 'push'
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          PGYER_UPDATE_DESC: GitHub Actions 自动构建
        run: |
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' ! -name '*unaligned.apk' -print -quit)"
          test -n "$APK_PATH"
          ./scripts/pgyer.sh upload "file:$APK_PATH"
